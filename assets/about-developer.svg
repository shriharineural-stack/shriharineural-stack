<svg width="1600" height="900" viewBox="0 0 1600 900"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- DARK BACKGROUND -->
    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01030a"/>
      <stop offset="50%" stop-color="#070817"/>
      <stop offset="100%" stop-color="#15020a"/>
    </linearGradient>

    <!-- NEON RED -->
    <linearGradient id="neon"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>

    <!-- GRID -->
    <pattern id="grid"
             width="42"
             height="42"
             patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42"
            fill="none"
            stroke="#ff1744"
            stroke-opacity="0.09"
            stroke-width="1"/>
    </pattern>

    <!-- RED GLOW -->
    <filter id="neonGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="9"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- SOFT GLOW -->
    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="35"/>

    </filter>

    <!-- CENTER LIGHT -->
    <radialGradient id="centerLight">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="1600"
    height="900"
    fill="url(#bg)"/>


  <!-- TECH GRID -->

  <rect
    width="1600"
    height="900"
    fill="url(#grid)"/>


  <!-- AMBIENT NEON LIGHT -->

  <ellipse
    cx="800"
    cy="450"
    rx="650"
    ry="350"
    fill="url(#centerLight)"
    filter="url(#softGlow)"/>


  <!-- OUTER NEON FRAME -->

  <rect
    x="22"
    y="22"
    width="1556"
    height="856"
    rx="32"
    fill
