<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="900"
     viewBox="0 0 1600 900">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01020a"/>
      <stop offset="0.5" stop-color="#070817"/>
      <stop offset="1" stop-color="#180209"/>
    </linearGradient>

    <!-- GRID -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#ff1744"
            stroke-opacity="0.08"/>
    </pattern>

    <!-- NEON -->
    <linearGradient id="neon"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0" stop-color="#ff1744"/>
      <stop offset="0.5" stop-color="#ff6680"/>
      <stop offset="1" stop-color="#ff1744"/>
    </linearGradient>

    <!-- GLOW -->
    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
        stdDeviation="7"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <radialGradient id="light">
      <stop offset="0" stop-color="#ff1744" stop-opacity="0.22"/>
     
