<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="420"
     viewBox="0 0 1200 420">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020204"/>
      <stop offset="0.55" stop-color="#09090d"/>
      <stop offset="1" stop-color="#21030a"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0015"/>
      <stop offset="0.5" stop-color="#ff1744"/>
      <stop offset="1" stop-color="#7a0015"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff1744" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#ff1744"
            stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Grid -->
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Center Glow -->
  <ellipse cx="600"
           cy="210"
           rx="420"
           ry="180"
           fill="url(#glow)"/>

  <!-- Top Line -->
  <rect x="100"
        y="35"
        width="1000"
        height="2"
        fill="url(#red)"/>

  <!-- Bottom Line -->
  <rect x="100"
        y="383"
        width="1000"
        height="2"
        fill="url(#red)"/>

  <!-- Left Circuit -->
  <g fill="none"
     stroke="#ff1744"
     stroke-width="2"
     opacity="0.7">

    <path d="M0 110 H130 L180 60 H300"/>
    <path d="M0 300 H120 L175 355 H310"/>

  </g>

  <!-- Right Circuit -->
  <g fill="none"
     stroke="#ff1744"
     stroke-width="2"
     opacity="0.7">

    <path d="M1200 110 H1070 L1020 60 H900"/>
    <path d="M1200 300 H1080 L1025 355 H890"/>

  </g>

  <!-- Nodes -->
  <g fill="#ff1744">

    <circle cx="130" cy="110" r="5"/>
    <circle cx="180" cy="60" r="5"/>
    <circle cx="120" cy="300" r="5"/>
    <circle cx="175" cy="355" r="5"/>

    <circle cx="1070" cy="110" r="5"/>
    <circle cx="1020" cy="60" r="5"/>
    <circle cx="1080" cy="300" r="5"/>
    <circle cx="1025" cy="355" r="5"/>

  </g>

  <!-- Center Title -->
  <text x="600"
        y="190"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="42"
        font-weight="bold"
        letter-spacing="6">
    LET'S CONNECT
  </text>

  <text x="600"
        y="230"
        text-anchor="middle"
        fill="#ff1744"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        letter-spacing="4">
    BUILD • CREATE • INNOVATE
  </text>

  <text x="600"
        y="270"
        text-anchor="middle"
        fill="#a1a1aa"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3">
   
