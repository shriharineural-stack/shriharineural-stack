<svg
  width="1600"
  height="420"
  viewBox="0 0 1600 420"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient
      id="bg"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%">

      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#09070d"/>
      <stop offset="100%" stop-color="#16060b"/>

    </linearGradient>


    <!-- Neon red -->
    <linearGradient
      id="red"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="30%" stop-color="#ef233c"/>
      <stop offset="50%" stop-color="#ff6b7d"/>
      <stop offset="70%" stop-color="#ef233c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>

      <animate
        attributeName="x1"
        from="-100%"
        to="100%"
        dur="6s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        from="0%"
        to="200%"
        dur="6s"
        repeatCount="indefinite"/>

    </linearGradient>


    <!-- Glow -->
    <filter
      id="red-glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">

      <feGaussianBlur
        stdDeviation="7"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- Ambient glow -->
    <filter
      id="ambient"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">

      <feGaussianBlur stdDeviation="45"/>

    </filter>


    <!-- Grid -->
    <pattern
      id="grid"
      width="30"
      height="30"
      patternUnits="userSpaceOnUse">

      <path
        d="M30 0H0V30"
        fill="none"
        stroke="#ef233c"
        stroke-width="0.7"
        stroke-opacity="0.07"/>

    </pattern>

  </defs>


  <!-- Background -->
  <rect
    width="1600"
    height="420"
    fill="url(#bg)"/>


  <!-- Subtle grid -->
  <rect
    width="1600"
    height="420"
    fill="url(#grid)"/>


  <!-- Ambient red lights -->

  <ellipse
    cx="180"
    cy="210"
    rx="250"
    ry="150"
    fill="#ef233c"
    opacity="0.08"
    filter="url(#ambient)"/>

  <ellipse
    cx="1420"
    cy="210"
    rx="250"
    ry="150"
    fill="#ef233c"
    opacity="0.08"
    filter="url(#ambient)"/>


  <!-- Left neural network -->

  <g
    stroke="#ef233c"
    stroke-width="1.5"
    opacity="0.65">

    <line x1="100" y1="210" x2="220" y2="145"/>
    <line x1="100" y1="210" x2="220" y2="275"/>

    <line x1="220" y1="145" x2="330" y2="210"/>
    <line x1="220" y1="275" x2="330" y2="210"/>

    <line x1="330" y1="210" x2="420" y2="160"/>
    <line x1="330" y1="210" x2="420" y2="260"/>

  </g>


  <g
    fill="#ff465d"
    filter="url(#red-glow)">

    <circle cx="100" cy="210" r="5"/>
    <circle cx="220" cy="145" r="5"/>
    <circle cx="220" cy="275" r="5"/>
    <circle cx="330" cy="210" r="7"/>
    <circle cx="420" cy="160" r="4"/>
    <circle cx="420" cy="260" r="4"/>

  </g>


  <!-- Right neural network -->

  <g
    stroke="#ef233c"
    stroke-width="1.5"
    opacity="0.65">

    <line x1="1180" y1="160" x2="1270" y2="210"/>
    <line x1="1180" y1="260" x2="1270" y2="210"/>

    <line x1="1270" y1="210" x2="1380" y2="145"/>
    <line x1="1270" y1="210" x2="1380" y2="275"/>

    <line x1="1380" y1="145" x2="1500" y2="210"/>
    <line x1="1380" y1="275" x2="1500" y2="210"/>

  </g>


  <g
    fill="#ff465d"
    filter="url(#red-glow)">

    <circle cx="1180" cy="160" r="4"/>
    <circle cx="1180" cy="260" r="4"/>
    <circle cx="1270" cy="210" r="7"/>
    <circle cx="1380" cy="145" r="5"/>
    <circle cx="1380" cy="275" r="5"/>
    <circle cx="1500" cy="210" r="5"/>

  </g>


  <!-- Central glow -->

  <ellipse
    cx="800"
    cy="210"
    rx="300"
    ry="80"
    fill="#ef233c"
    opacity="0.08"
    filter="url(#ambient)"/>


  <!-- Main text -->

  <text
    x="800"
    y="165"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="bold"
    letter-spacing="7"
    fill="#ff6b7d">

    LET'S CONNECT

  </text>


  <text
    x="800"
    y="220"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="900"
    letter-spacing="4"
    fill="#ffffff">

    BUILD • CREATE • INNOVATE

  </text>


  <text
    x="800"
    y="265"
    text-anchor="middle"
    font-family="monospace"
    font-size="17"
    letter-spacing="3"
    fill="#94a3b8">

    COLLABORATION • PROJECTS • IDEAS • TECHNOLOGY

  </text>


  <!-- Terminal -->

  <rect
    x="610"
    y="300"
    width="380"
    height="48"
    rx="24"
    fill="#050810"
    stroke="#ef233c"
    stroke-opacity="0.5"/>


  <circle
    cx="640"
    cy="324"
    r="5"
    fill="#ef233c"
    filter="url(#red-glow)"/>


  <text
    x="665"
    y="330"
    font-family="monospace"
    font-size="16"
    fill="#ff465d">

    &gt; connect_and_build_

  </text>


  <!-- Floating particles -->

  <g fill="#ff465d">

    <circle cx="500" cy="90" r="2"/>
    <circle cx="560" cy="330" r="2"/>
    <circle cx="1040" cy="90" r="2"/>
    <circle cx="1100" cy="335" r="2"/>
    <circle cx="760" cy="75" r="2"/>
    <circle cx="850" cy="355" r="2"/>

  </g>


</svg>
