<svg width="1600" height="700" viewBox="0 0 1600 700"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020203"/>
      <stop offset="45%" stop-color="#09090c"/>
      <stop offset="100%" stop-color="#180306"/>
    </linearGradient>

    <!-- Red Neon -->
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#450008"/>
      <stop offset="50%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#70000f"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="50"
             height="50"
             patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50"
            fill="none"
            stroke="#ff1744"
            stroke
