
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

  <defs>

    <!-- DARK BLUE BACKGROUND -->
    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="55%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#021326"/>
    </linearGradient>

    <!-- BLUE NEON GRADIENT -->
    <linearGradient id="blue"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#0077ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <!-- NEON GLOW -->
    <filter id="glow"
            x="-30%" y="-30%"
            width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- TECH GRID -->
    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45"
            fill="none"
            stroke="#008cff"
            stroke-opacity="0.09"
            stroke-width="1"/>
    </pattern>

  </defs>

  <!-- BACKGROUND -->
  <rect width="1600"
        height="500"
        fill="url(#bg)"/>

  <rect width="1600"
        height="500"
        fill="url(#grid)"/>

  <!-- CENTRAL BLUE GLOW -->
  <ellipse cx="800" cy="250"
           rx="500" ry="170"
           fill="#008cff"
           opacity="0.08"
           filter="url(#glow)"/>

  <!-- OUTER NEON FRAME -->
  <rect x="20" y="20"
        width="1560" height="460"
        rx="28"
        fill="none"
        stroke="url(#blue)"
        stroke-width="3"
        filter="url(#glow)"/>

  <!-- INNER FRAME -->
  <rect x="38" y="38"
        width="1524" height="424"
        rx="20"
        fill="none"
        stroke="#00cfff"
        stroke-opacity="0.3"
        stroke-width="1"/>

  <!-- LEFT CIRCUIT LINES -->
  <path d="M60 160H260L340 220"
        fill="none"
        stroke="#008cff"
        stroke-width="3"/>

  <path d="M60 340H260L340 280"
        fill="none"
        stroke="#008cff"
        stroke-width="3"/>

  <circle cx="60" cy="160" r="7"
          fill="#00d4ff"
          filter="url(#glow)"/>

  <circle cx="60" cy="340" r="7"
          fill="#00d4ff"
          filter="url(#glow)"/>

  <circle cx="340" cy="220" r="6"
          fill="#38bdf8"/>

  <circle cx="340" cy="280" r="6"
          fill="#38bdf8"/>

  <!-- RIGHT CIRCUIT LINES -->
  <path d="M1540 160H1340L1260 220"
        fill="none"
        stroke="#008cff"
        stroke-width="3"/>

  <path d="M1540 340H1340L1260 280"
        fill="none"
        stroke="#008cff"
        stroke-width="3"/>

  <circle cx="1540" cy="160" r="7"
          fill="#00d4ff"
          filter="url(#glow)"/>

  <circle cx="1540" cy="340" r="7"
          fill="#00d4ff"
          filter="url(#glow)"/>

  <circle cx="1260" cy="220" r="6"
          fill="#38bdf8"/>

  <circle cx="1260" cy="280" r="6"
          fill="#38bdf8"/>

  <!-- CENTRAL OUTER CIRCLE -->
  <circle cx="800" cy="250"
          r="125"
          fill="none"
          stroke="#008cff"
          stroke-opacity="0.2"
          stroke-width="2"/>

  <!-- CENTRAL INNER CIRCLE -->
  <circle cx="800" cy="250"
          r="100"
          fill="none"
          stroke="#00cfff"
          stroke-opacity="0.4"
          stroke-width="2"/>

  <!-- MAIN TITLE -->
  <text x="800" y="225"
        text-anchor="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="58"
        font-weight="bold"
        letter-spacing="8">
    LET'S CONNECT
  </text>

  <!-- NEON UNDERLINE -->
  <line x1="555" y1="255"
        x2="1045" y2="255"
        stroke="url(#blue)"
        stroke-width="4"
        filter="url(#glow)"/>

  <!-- SUBTITLE -->
  <text x="800" y="305"
        text-anchor="middle"
        fill="#38bdf8"
        font-family="monospace"
        font-size="22"
        letter-spacing="4">
    BUILD • CREATE • INNOVATE
  </text>

  <!-- DESCRIPTION -->
  <text x="800" y="350"
        text-anchor="middle"
        fill="#a5b4c8"
        font-family="monospace"
        font-size="16"
        letter-spacing="2">
    LET'S BUILD SOMETHING AMAZING TOGETHER
  </text>

  <!-- NEON DOTS -->
  <circle cx="520" cy="350" r="3"
          fill="#00d4ff"/>

  <circle cx="1080" cy="350" r="3"
          fill="#00d4ff"/>

  <!-- FOOTER -->
  <text x="800" y="425"
        text-anchor="middle"
        fill="#38bdf8"
        font-family="monospace"
        font-size="13"
        letter-spacing="3"
        opacity="0.9">
    SHRI HARI • SOFTWARE DEVELOPER
  </text>

</svg>
