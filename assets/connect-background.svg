<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="55%" stop-color="#0a0710"/>
      <stop offset="100%" stop-color="#17030a"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff003c"/>
      <stop offset="50%" stop-color="#ff174f"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45"
            fill="none"
            stroke="#ff003c"
            stroke-opacity="0.08"/>
    </pattern>

  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- AMBIENT GLOW -->
  <ellipse cx="800"
           cy="250"
           rx="500"
           ry="170"
           fill="#ff003c"
           opacity="0.07"
           filter="url(#glow)"/>

  <!-- OUTER NEON FRAME -->
  <rect x="20"
        y="20"
        width="1560"
        height="460"
        rx="28"
        fill="none"
        stroke="url(#red)"
        stroke-width="3"
        filter="url(#glow)"/>

  <rect x="38"
        y="38"
        width="1524"
        height="424"
        rx="20"
        fill="none"
        stroke="#ff174f"
        stroke-opacity="0.25"/>

  <!-- LEFT CIRCUITS
